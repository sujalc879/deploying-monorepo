name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Triggers the workflow when code is pushed to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (enables advanced build features and caching)
      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      # Step 3: Authenticate with Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Step 4: Build the image and push it to the registry
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-app:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-app:${{ github.sha }}
